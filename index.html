<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <div class="header">
            <h2>⚡ Calculator</h2>
            <button onclick="clearHistory()">Clear History</button>
        </div>

        <!-- Display -->
        <div class="display">
            <div class="previous" id="previous"></div>
            <div class="current" id="current">0</div>
        </div>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button class="key special" onclick="clearAll()">AC</button>
            <button class="key special" onclick="deleteLast()">DEL</button>
            <button class="key special" onclick="percentage()">%</button>
            <button class="key operator" onclick="chooseOperator('/')">÷</button>

            <button class="key" onclick="appendNumber('7')">7</button>
            <button class="key" onclick="appendNumber('8')">8</button>
            <button class="key" onclick="appendNumber('9')">9</button>
            <button class="key operator" onclick="chooseOperator('*')">×</button>

            <button class="key" onclick="appendNumber('4')">4</button>
            <button class="key" onclick="appendNumber('5')">5</button>
            <button class="key" onclick="appendNumber('6')">6</button>
            <button class="key operator" onclick="chooseOperator('-')">−</button>

            <button class="key" onclick="appendNumber('1')">1</button>
            <button class="key" onclick="appendNumber('2')">2</button>
            <button class="key" onclick="appendNumber('3')">3</button>
            <button class="key operator" onclick="chooseOperator('+')">+</button>

            <button class="key special" onclick="toggleSign()">+/−</button>
            <button class="key zero" onclick="appendNumber('0')">0</button>
            <button class="key" onclick="appendNumber('.')">.</button>

            <button class="key equal" onclick="calculate()">=</button>

        </div>

        <!-- History -->
        <div class="history">
            <h4>Calculation History</h4>
            <div id="historyList">No calculations yet</div>
        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
